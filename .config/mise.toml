# Tools for this repo's own tests and CI. Renovate's mise manager reads the pins here.
[tools]
# Python comes from .python-version (shared with uv and Renovate); PYTHON_VERSION overrides it.
python = "{{ get_env(name='PYTHON_VERSION', default=read_file(path=config_root ~ '/.python-version') | trim) }}"
uv = "0.13.0"

[tasks.test]
description = "Run the template test suite"
run = "uv run pytest"
