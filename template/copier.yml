# Template repo configuration. This file is yours: copier-copier wrote it once
# and will not overwrite it on `copier update`.
_subdirectory: template
_min_copier_version: "9.10.3"
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# Add questions for the projects this template generates, for example:
# project_name:
#   type: str
#   help: Name of the generated project

# Files a generated project owns after the first render, so `copier update` leaves them
# alone. When this template's payload ships cobo-managed boilerplate, list `cobo.lock` and
# every file the generated project's own `cobo.lock` tracks (`.gitignore`, plus `.gitattributes`
# or `.editorconfig` when cobo manages them too), and nothing else: a plain file nothing
# re-renders should keep receiving updates:
# _skip_if_exists:
#   - .gitignore
#   - cobo.lock
# `_skip_if_exists` also applies to `copier copy --overwrite`. To adopt an existing project, copy
# every file listed above aside and delete them so the template's matched set is installed, then restore the project's own rules below the end fence and re-dump the cobo
# sources it used (`cobo gitignore dump <names> --lock`); keep its pair as is when that is intended.
