---
name: Cobo Drift Check
# Runs `cobo check` to detect when the cobo-managed files tracked in cobo.lock
# (.gitignore, .gitattributes, .editorconfig) have drifted from their upstream
# templates. `cobo update` hits the network and is inherently flaky, so this runs
# on a weekly schedule and on demand, never on pull_request. A failure is a
# maintenance signal (regenerate with `cobo update && cobo sync`), not a merge
# blocker.
"on":
  workflow_dispatch:
  schedule:
    # Weekly, Monday 07:00 UTC.
    - cron: "0 7 * * 1"
permissions: {}
jobs:
  cobo-drift:
    name: Check cobo drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Refresh cobo sources
        run: uvx cobo update
      - name: Check for cobo drift
        run: uvx cobo check
