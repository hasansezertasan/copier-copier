[project]
name = "copier-copier"
version = "0.0.0"
description = "A Copier template that generates copier-<subject> template repositories."
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "copier==9.18.2",
    "pytest>=8",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
